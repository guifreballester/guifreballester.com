version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Batch routine minor/patch bumps into a single PR to keep noise low.
      # Major bumps still get their own PR so they can be reviewed individually.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
